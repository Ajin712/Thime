<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F3F3F1; --outer:#E4E4E2; --ink:#1c1c1e; --ink2:#55555a; --muted:#a2a2a6; --line:#e3e3e1;
  --chip:#e9e9e7; --chipOn:#d9d9d7; --paper:#ffffff;
  --y:#FBE36E; --yTop:#FDF0A8; --o:#F4C27E; --g:#BFEA9D; --b:#D5E3F2; --p:#F6D3D0;
  --hand:'Nanum Pen Script', 'Gaegu', cursive;
  --ui:'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--outer);color:var(--ink);font-family:var(--ui)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
#app{overflow-x:hidden;max-width:420px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding:22px 18px 110px;box-shadow:0 0 40px rgba(0,0,0,.06)}
.hand{font-family:var(--hand)}
/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:40px}
.top h1{font-family:var(--hand);font-size:36px;font-weight:400;line-height:1;flex:1;letter-spacing:-.5px}
.top .ttl{font-size:19px;font-weight:600;flex:1}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;position:relative}
.ib:hover{background:rgba(0,0,0,.05)}
.ib svg{width:23px;height:23px}
.dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.cnt{background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px}
.row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.sub{font-size:17px;color:var(--ink2)}
.muted{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{background:var(--chip);color:var(--muted);font-size:14px;padding:8px 16px;border-radius:9px}
.chip.on{background:var(--chipOn);color:var(--ink)}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{width:34px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.seg button.on{background:var(--chipOn);color:var(--ink)}
.seg svg{width:16px;height:16px}
/* pin + sticky */
.pin{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:12px;height:26px;z-index:3;pointer-events:none}
.sticky{position:relative;background:var(--y);box-shadow:0 8px 18px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
.sticky::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;background:rgba(255,255,255,.38);pointer-events:none}
.c-y{background:var(--y)}.c-o{background:var(--o)}.c-g{background:var(--g)}.c-b{background:var(--b)}.c-p{background:var(--p)}.c-w{background:var(--paper)}
/* card stack */
.stack{position:relative;height:330px;margin:26px 8px 10px 4px;touch-action:pan-y}
.stack .back{position:absolute;inset:14px -14px -10px 14px;transform:rotate(3deg)}
.stack .back2{position:absolute;inset:6px -6px -4px 6px;transform:rotate(1.2deg)}
.stack .front{position:absolute;inset:0;padding:64px 22px 20px;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s}
.stack .front.swap{transform:translateX(-30px) rotate(-3deg);opacity:.2}
.front .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--hand);font-size:40px;line-height:1.25;color:#3a3a3a;word-break:keep-all}
.front .foot{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.front .use{display:flex;gap:6px;align-items:center;padding:6px 0}
.front .src{position:absolute;top:36px;left:22px;font-size:12px;color:rgba(0,0,0,.4)}
.hint{font-size:12px;color:var(--muted);margin:22px 4px 26px;line-height:1.5}
/* grids */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px;padding-top:14px}
.grid.list{grid-template-columns:minmax(0,1fr)}
.mini{position:relative;background:var(--paper);min-height:150px;padding:22px 14px 14px;box-shadow:0 6px 14px rgba(0,0,0,.06);text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.mini .mq{font-family:var(--hand);font-size:22px;line-height:1.2;color:#333;flex:1;word-break:keep-all}
.mini.locked .mq{color:#b9b9bb}
.mini.open{background:var(--y)}
.mini .st{font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.mini .st svg{width:13px;height:13px}
.mini.open .st{font-weight:700;color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
/* fab */
.fab{position:fixed;bottom:28px;left:50%;transform:translateX(calc(min(210px, 50vw) - 100% - 18px));background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:14px;padding:13px 20px;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:20}
/* record */
.recbar{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500}
.rdot{width:9px;height:9px;border-radius:50%;background:#d33;display:inline-block}
.rdot.idle{background:#c4c4c6}
.rdot.live{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.bigsticky{margin:30px 4px 0;padding:44px 22px 24px;min-height:300px}
.prompt{font-size:14px;color:rgba(0,0,0,.45);margin-bottom:10px;position:relative;z-index:1}
.tx{font-family:var(--hand);font-size:25px;line-height:1.45;min-height:200px;outline:none;position:relative;z-index:1;white-space:pre-wrap;word-break:keep-all;color:#3b3b3b}
.tx:empty::before{content:attr(data-ph);color:rgba(0,0,0,.3)}
.tx mark{background:linear-gradient(transparent 55%, rgba(200,170,0,.35) 55%);color:#111}
.tx .interim{color:rgba(0,0,0,.4)}
.qframe{position:relative;background:#fff;margin:34px 4px 0;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 14px rgba(0,0,0,.06)}
.qframe input{flex:1;background:#ececeb;border:none;outline:none;padding:16px 14px;font-family:var(--hand);font-size:23px;min-width:0}
.qside{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.qside button{font-size:16px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.wave{display:flex;justify-content:center;align-items:center;gap:4px;height:46px;margin:22px 0 10px}
.wave i{width:2px;background:#bbb;border-radius:1px;height:8px;transition:height .15s}
.wave.live i{animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:var(--h)}}
.ctrls{display:flex;justify-content:center;align-items:center;gap:40px;margin-top:8px}
.cb{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);display:grid;place-items:center}
.cb svg{width:22px;height:22px}
.cb:disabled{opacity:.35;cursor:default}
.cbig{width:94px;height:94px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.cbig .sq{width:28px;height:28px;border-radius:5px;background:#e24b3b}
.cbig .ci{width:34px;height:34px;border-radius:50%;background:#e24b3b}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;min-height:16px}
/* recall */
.ago{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 0 24px}
.ago b{font-size:40px;font-weight:800;letter-spacing:-1px}
.ago span{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;padding-bottom:8px}
.frame{position:relative;background:#fff;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.07)}
.frame .inner{background:#ececeb;padding:22px 18px}
.frame .fq{font-family:var(--hand);font-size:27px;line-height:1.35;margin-bottom:16px;color:#2c2c2c}
.lbl{font-size:12px;color:var(--muted);margin-bottom:6px;position:relative;z-index:1}
.frame .then{font-family:var(--hand);font-size:21px;line-height:1.4;color:#8d8d8f}
.play{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600}
.play svg{width:14px;height:14px}
.nowsticky{margin-top:40px;padding:40px 20px 20px}
.nowsticky textarea{width:100%;min-height:150px;background:transparent;border:none;outline:none;resize:none;font-family:var(--hand);font-size:25px;line-height:1.45;position:relative;z-index:1}
.nowsticky textarea::placeholder{color:rgba(0,0,0,.3)}
.bottombar{display:flex;align-items:center;justify-content:space-between;margin-top:30px}
.tog{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.tog .sw{width:52px;height:30px;border-radius:15px;background:#cfcfcd;position:relative;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on .sw{background:var(--ink)}
.tog.on .sw::after{left:26px}
.pillbtn{background:#fff;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.08);display:flex;gap:6px;align-items:center}
/* board */
.post{position:relative;background:#fff;padding:22px 12px 12px;box-shadow:0 6px 14px rgba(0,0,0,.06);text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}
.post .pq{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .pa{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:var(--hand);font-size:21px;line-height:1.3;word-break:keep-all;color:#2e2e2e}
.grid.list .post .pa{aspect-ratio:auto;min-height:110px}
.post .pf{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.post .au{text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}
.post .cm{display:flex;gap:4px;align-items:center;color:var(--muted)}
.post .cm svg{width:14px;height:14px}
.search{width:100%;background:var(--chip);border:none;outline:none;border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:14px}
/* detail */
.who{display:flex;align-items:center;gap:12px;flex:1}
.av{width:44px;height:44px;border-radius:50%;background:#e2e2e0;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--ink2)}
.who b{display:block;font-size:17px;font-weight:600}
.dsticky{margin:30px 4px 0;padding:44px 22px 26px}
.dsticky .dq{font-size:13px;color:rgba(0,0,0,.42);margin-bottom:12px;position:relative;z-index:1}
.dsticky .da{font-family:var(--hand);font-size:27px;line-height:1.45;position:relative;z-index:1;word-break:keep-all}
.thead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px;font-size:17px;color:var(--ink2)}
.thead .cnt{font-size:11px;padding:2px 7px}
.bq{background:#e6e6e4;color:var(--muted);font-size:14px;line-height:1.5;padding:12px 16px;border-radius:12px;max-width:82%;margin-bottom:12px}
.ba{background:#fff;font-family:var(--hand);font-size:21px;line-height:1.4;padding:14px 18px;max-width:86%;margin:0 0 16px auto;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.pend{font-size:11px;color:var(--muted);margin:-6px 0 14px 4px}
.composer{position:sticky;bottom:16px;display:flex;gap:10px;align-items:center;margin-top:20px}
.composer .in{flex:1;display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:0 14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.composer .in svg{width:16px;height:16px;color:var(--muted);flex:none}
.composer input{flex:1;border:none;outline:none;padding:16px 0;font-size:15px;background:transparent;min-width:0}
.send{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px}
/* inbox */
.banner{display:block;width:100%;text-align:left;background:var(--y);padding:16px 18px;font-family:var(--hand);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:16px}
.rc{background:#fff;padding:16px 18px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.rc .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;align-items:center}
.rc .meta .t{font-family:ui-monospace,monospace}
.rc .txt{font-size:16px;line-height:1.55;color:var(--ink2)}
.rc.ign{opacity:.45}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:#e6e6e4;color:var(--muted)}
.tag.dark{background:var(--ink);color:#fff}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1;padding:11px;border-radius:8px;font-size:15px;display:flex;gap:6px;justify-content:center;align-items:center}
.acts .re{background:#dde8f6;color:#3d5f8f}
.acts .no{background:#f6dcdc;color:#b34848}
.acts svg{width:14px;height:14px}
.rbox{position:relative;margin-top:14px;padding:14px 70px 14px 16px;background:var(--y)}
.rbox textarea{width:100%;min-height:62px;background:transparent;border:none;outline:none;resize:none;font-family:var(--hand);font-size:22px;line-height:1.35}
.rbox .send{position:absolute;right:12px;bottom:12px;width:44px;height:44px}
.myreply{font-family:var(--hand);font-size:19px;color:#888;margin-top:8px;padding-left:10px;border-left:3px solid var(--y)}
.mk{margin-top:10px;font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
/* home compose */
.compose-wrap{position:relative;margin:30px 8px 34px 4px}
.compose-wrap .back{position:absolute;inset:14px -14px -10px 14px;transform:rotate(3deg)}
.compose-wrap .back2{position:absolute;inset:6px -6px -4px 6px;transform:rotate(1.2deg)}
.compose{position:relative;padding:62px 24px 24px;cursor:pointer;min-height:330px;display:flex;flex-direction:column}
.compose .ct{font-family:var(--hand);font-size:46px;line-height:1.1;color:#2b2b2b;position:relative;z-index:1}
.compose .cs{font-size:13px;line-height:1.55;color:rgba(0,0,0,.5);margin:14px 0 22px;flex:1}
.cbtns{display:flex;gap:10px}
.cbtns button{display:flex;gap:7px;align-items:center;justify-content:center;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:600}
.cbtns svg{width:18px;height:18px}
.cmain{flex:1;background:var(--ink);color:#fff !important;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.csub{background:rgba(255,255,255,.75)}
.arr{display:block;width:100%;text-align:left;background:#fff;border-left:6px solid var(--y);padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.arr .when{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.arr .aq{display:block;font-family:var(--hand);font-size:24px;line-height:1.25;margin-bottom:6px}
.arr .go{font-size:13px;font-weight:600}
.nextl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);margin:14px 4px 0}
.nextl svg{width:14px;height:14px}
.tocards{display:flex;width:100%;justify-content:space-between;align-items:center;margin-top:30px;padding:16px 18px;background:#fff;border-radius:14px;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.tocards span{font-size:12px;color:var(--muted)}
.tocards b{display:block;font-size:15px;color:var(--ink);margin-top:2px}
/* training */
.muscle{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:26px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.mh{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:12px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mstats b{display:block;font-size:26px;font-weight:800}
.mstats span{font-size:11px;color:var(--muted)}
.dots{display:flex;justify-content:space-between}
.dots span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.dots i{width:22px;height:22px;border-radius:7px;background:var(--chip)}
.dots .on i{background:var(--y);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}
.dots .on{color:var(--ink)}
.sl{font-size:13px;font-weight:600;margin:6px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sg{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.sin{width:100%;background:#fff;border:none;outline:none;border-radius:12px;padding:14px;font-size:15px;margin-bottom:14px}
.go-train{width:100%;background:var(--ink);color:#fff !important;border-radius:14px;padding:16px;font-size:16px;font-weight:700;margin-top:6px}
.tbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink2);margin-top:-6px}
.tbar span:first-child{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tbar.done{background:var(--y)}
.tsteps{background:#fff;margin:26px 4px 0;padding:14px 16px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.tsteps label{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5;margin:6px 0}
.gintro{font-size:14px;line-height:1.6;color:var(--ink2);margin-bottom:20px}
.gitem{display:block;width:100%;text-align:left;background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.gitem b{font-size:16px;margin-right:8px}
.gitem p{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}
.gempty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:40px 0;color:var(--muted);font-size:13px}
.gempty svg{width:32px;height:32px}
.gempty b{color:var(--ink2);font-size:15px}
.gsum{font-size:15px;line-height:1.6;margin-bottom:14px}
.gsteps{padding-left:20px;font-size:14px;line-height:1.7;margin-bottom:14px}
.gtip{background:var(--y);padding:12px 14px;font-size:13px;line-height:1.5}
.gsheet{max-height:80vh;overflow-y:auto}
/* tutorial popup */
.dim.center{align-items:center;padding:20px}
.tut{width:100%;max-width:380px;padding:48px 24px 22px;animation:up .25s;max-height:88vh;overflow-y:auto}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px;position:relative;z-index:1}
.tdots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.18)}
.tdots i.on{background:var(--ink);width:18px;border-radius:4px}
.tl{font-size:12px;color:rgba(0,0,0,.45);margin-bottom:10px;position:relative;z-index:1}
.tt{font-family:var(--hand);font-size:34px;font-weight:400;line-height:1.15;margin-bottom:12px}
.tb{font-size:15px;line-height:1.65;white-space:pre-wrap;color:#333;min-height:90px}
.tnav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.tnav div{display:flex;gap:8px}
.tskip{font-size:13px;color:rgba(0,0,0,.45)}
.tprev{padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.7);font-weight:600}
.tnext{padding:12px 20px;border-radius:12px;background:var(--ink);color:#fff !important;font-weight:700}
.tut .gempty{padding:26px 0}
.tbar{cursor:pointer}
/* coach chat */
.prog{display:flex;gap:4px;margin:12px 0 0}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--chip)}
.prog i.ok{background:var(--c)}
.prog i.cur{background:var(--c);opacity:.45;animation:blink 1.2s infinite}
.qmini{margin:26px 4px 6px;padding:30px 16px 14px;font-family:var(--hand);font-size:24px;line-height:1.25}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const MIN = 6e4, HOUR = 36e5, DAY = 864e5;
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const fmtDT = t => { const d = new Date(t); return `${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fmtD = t => { const d = new Date(t); return `${p2(d.getMonth()+1)}.${p2(d.getDate())}`; };
const fmtT = t => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
function ago(t){
  const d = now() - t;
  if (d < MIN) return '방금 전';
  if (d < HOUR) return Math.floor(d / MIN) + '분 전';
  if (d < DAY) return Math.floor(d / HOUR) + '시간 전';
  return Math.floor(d / DAY) + '일 전';
}
function left(t){
  const d = t - now();
  if (d <= 0) return '곧 열려요';
  if (d < HOUR) { const s = Math.ceil(d / 1000); return `${Math.floor(s/60)}:${p2(s%60)} 뒤 열림`; }
  if (d < DAY) return Math.ceil(d / HOUR) + '시간 뒤 열림';
  return `D-${Math.ceil(d / DAY)} · ${fmtD(t)} 열림`;
}

/* ---------- AI(데모): 규칙 기반 분류·질문 감지·추천 ---------- */
const CAT_WORDS = {
  '과학': ['몸','물','바다','생명','우주','동물','기억','뇌','시간','세포','과학','지구','별','사막'],
  '나':   ['나는','내가','나를','자아','성격','외모','사랑','정체성','결정','스스로','생각해','AI','인공지능','판단'],
  '일상': ['하루','물건','친구','엄마','부모','밥','잠','일상','습관','학교','상장']
};
function tagOf(text){
  let best = '일상', score = 0;
  for (const [c, ws] of Object.entries(CAT_WORDS)) {
    const s = ws.filter(w => text.includes(w)).length;
    if (s > score) { score = s; best = c; }
  }
  return best;
}
const Q_END = /(\?|？|까|까요|나요|니|을까|일까|ㄹ까|는가|인가)\s*$/;
function detectQ(units){
  const parts = units.flatMap(u => u.split(/(?<=[?？.!])\s+|\n+/)).map(s => s.trim()).filter(Boolean);
  for (let i = parts.length - 1; i >= 0; i--) if (Q_END.test(parts[i])) return parts[i];
  return '';
}

/* 추천: 최근에 덜 써 본 생각 근육부터, 아직 안 다룬 질문으로 고른다 */
function recommendQ(n = 3, off = 0){
  const recent = S.mine.slice(-4).map(m => m.qtype).filter(Boolean);
  const used = new Set(S.mine.map(m => m.q));
  const types = [...TRAIN_Q].sort((a, b) => recent.filter(t => t === a.type).length - recent.filter(t => t === b.type).length);
  const out = [];
  for (let k = 0; out.length < n && k < types.length * 6; k++) {
    const t = types[(k + off) % types.length];
    const pool = t.qs.filter(q => !used.has(q) && !out.some(o => o.q === q));
    if (pool.length && !out.some(o => o.type === t.type)) out.push({type: t.type, desc: t.desc, q: pool[(off + k) % pool.length]});
  }
  return out;
}

/* 음성 파일은 IndexedDB에 저장 (과거의 내 목소리 다시 듣기) */
const audioDB = {
  db: null,
  open(){ return new Promise((res, rej) => { if (this.db) return res(this.db);
    const r = indexedDB.open('thime-audio', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('a');
    r.onsuccess = () => { this.db = r.result; res(this.db); };
    r.onerror = () => rej(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('a', 'readwrite'); tx.objectStore('a').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('a').objectStore('a').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};

  el.innerHTML = `<span>${msg}</span>${action ? `<u>${action}</u>` : ''}`;
  if (fn) el.querySelector('u').onclick = () => { el.remove(); fn(); };
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), action ? 6000 : 2800);
}

/* 생각 근육: 훈련 기록 통계 */
function muscleCard(){
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
  const days = new Set(S.mine.map(m => dayKey(m.createdAt)));
  let streak = 0, t = now();
  if (!days.has(dayKey(t))) t -= DAY;
  while (days.has(dayKey(t))) { streak++; t -= DAY; }
  const week = S.mine.filter(m => now() - m.createdAt < 7*DAY).length;
  const total = Math.round(S.mine.reduce((a, m) => a + (m.thinkSec || 0), 0) / 60);
  const names = ['일','월','화','수','목','금','토'];
  const dots = Array.from({length: 7}, (_, k) => {
    const d = now() - (6 - k) * DAY;
    return `<span class="${days.has(dayKey(d)) ? 'on' : ''}"><i></i>${names[new Date(d).getDay()]}</span>`;
  }).join('');
  return `<div class="muscle">
    <p class="mh">생각 근육</p>
    <div class="mstats"><div><b>${streak}</b><span>연속 훈련일</span></div><div><b>${week}</b><span>이번 주 훈련</span></div><div><b>${total}</b><span>생각한 시간(분)</span></div></div>
    <div class="dots">${dots}</div></div>`;
}

/* 훈련 준비: 질문 · 생각 도구 · 생각 시간 */
function startTraining(q = ''){
  let tech = TECHS.some(t => t.id === 'socratic') ? 'socratic' : '', mins = 10, off = 0, recs = recommendQ(3, 0), aiBusy = false;
  const dim = document.createElement('div');
  dim.className = 'dim';
  const draw = () => {
    dim.innerHTML = `<div class="sheet"><h3>생각 훈련 준비</h3><p>정한 시간 동안은 검색이나 AI 없이 스스로 생각해요.</p>
      <p class="sl">무엇을 생각할까요?</p>
      <input class="sin" id="tq" placeholder="생각할 질문을 직접 쓰거나 아래에서 골라요" value="${esc(q)}">
      <div class="recs">${recs.map(r => `<button class="rec ${q === r.q ? 'on' : ''}" data-q="${esc(r.q)}"><span>${esc(r.type)} · ${esc(r.desc)}</span>${esc(r.q)}</button>`).join('')}
        <div class="recbtns"><button class="more" data-more>↻ 다른 질문 추천받기</button><button class="more ai" data-ai>${aiBusy ? '만드는 중…' : '✨ AI가 내 기록에 맞춰 추천'}</button></div></div>
      <p class="sl">생각 도구 <button class="sg" data-g>기법 자세히 보기</button></p>
      <div class="chips">${[{id:'', name:'자유롭게'}, ...TECHS].map(g => `<button class="chip ${tech === g.id ? 'on' : ''}" data-t="${esc(g.id)}">${esc(g.name)}</button>`).join('')}</div>
      ${TECHS.length ? '' : '<p class="muted" style="margin:-8px 0 14px">훈련 기법이 추가되면 여기서 골라 훈련할 수 있어요.</p>'}
      <p class="sl">생각 시간</p>
      <div class="chips">${[[1,'1분 (시연)'],[5,'5분'],[10,'10분'],[20,'20분']].map(([m, l]) => `<button class="chip ${mins === m ? 'on' : ''}" data-m="${m}">${l}</button>`).join('')}</div>
      <button class="go-train" data-go>훈련 시작</button></div>`;
    dim.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { q = $('#tq').value; tech = b.dataset.t; draw(); });
    dim.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { q = $('#tq').value; mins = +b.dataset.m; draw(); });
    dim.querySelector('[data-g]').onclick = () => { dim.remove(); go('techs'); };
    dim.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { q = b.dataset.q; draw(); });
    dim.querySelector('[data-more]').onclick = () => { q = $('#tq').value; off += 3; recs = recommendQ(3, off); draw(); };
    dim.querySelector('[data-ai]').onclick = async () => {
      if (aiBusy) return;
      q = $('#tq').value; aiBusy = true; draw();
      const target = recommendQ(1, off)[0] || TRAIN_Q[0];
      const res = await askAI({task: 'recommend', type: target.type, desc: target.desc, recent: S.mine.slice(-6).map(m => m.q)});
      aiBusy = false;
      if (res && res.question) { recs = [{type: target.type, desc: 'AI 추천 · ' + target.desc, q: res.question, ai: true}, ...recs.filter(r => !r.ai)].slice(0, 3); q = res.question; aiQ[res.question] = target.type; }
      else toast('AI 추천을 쓸 수 없어요. 서버(run-mvp.bat)로 열었는지 확인해 주세요');
      if (document.body.contains(dim)) draw();
    };
    dim.querySelector('[data-go]').onclick = () => { const v = $('#tq').value.trim(); dim.remove(); go(hasSteps(tech) ? 'coach' : 'record', {train: true, prompt: v, tech, mins, qtype: qTypeOf(v)}); };
  };
  dim.onclick = e => { if (e.target === dim) dim.remove(); };
  draw(); document.body.appendChild(dim);
}

function paint(interim = ''){
  const tx = $('#tx'); if (!tx) return;
  const full = R.segs.join(' ');
  const q = autoQ(interim);
  let html = esc(full);
  if (q) { const e = esc(q), k = html.lastIndexOf(e); if (k >= 0) html = html.slice(0, k) + `<mark>${e}</mark>` + html.slice(k + e.length); }

function autoQ(interim = ''){
  const q = detectQ(interim ? [...R.segs, interim] : R.segs);

  return detectQ(R.segs);
}
async function recStart(){
  const typed = $('#tx').innerText.trim();
  R.segs = typed ? [typed] : [];
  try {
    R.stream = await navigator.mediaDevices.getUserMedia({audio:true});
    R.mr = new MediaRecorder(R.stream); R.chunks = [];
    R.mr.ondataavailable = e => { if (e.data.size) R.chunks.push(e.data); };
    R.stopP = new Promise(res => { R.mr.onstop = () => { R.blob = new Blob(R.chunks, {type: R.mr.mimeType || 'audio/webm'}); R.stream.getTracks().forEach(t => t.stop()); res(); }; });
    R.mr.start(500);
  } catch (e) { note('마이크를 쓸 수 없어요. 스티커에 직접 써도 돼요.'); }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const sr = new SR(); sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true;
    sr.onresult = e => {
      let interim = '';
      for (let k = e.resultIndex; k < e.results.length; k++) {
        const r = e.results[k];
        if (r.isFinal) { const t = r[0].transcript.trim(); if (t) R.segs.push(t); } else interim += r[0].transcript;
      }
      paint(interim.trim());
    };
    sr.onend = () => { if (R && R.on && !R.paused) { try { sr.start(); } catch (e) {} } };
    sr.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') note('음성 인식 권한이 없어요. 크롬 주소창의 마이크 권한을 허용하거나 직접 써 주세요.'); };
    try { sr.start(); } catch (e) {}
    R.sr = sr;
  } else note('이 브라우저는 음성 인식을 지원하지 않아요. 크롬으로 열거나 직접 써 주세요.');
  R.on = true; R.paused = false; R.sec = 0;
  R.timer = setInterval(() => { if (!R.paused) { R.sec++; recUI(); } }, 1000);
  $('#tx').setAttribute('contenteditable', 'false');
  recUI();
}
async function recStop(){
  if (!R || !R.on) return;
  R.on = false; clearInterval(R.timer);
  try { R.sr && R.sr.stop(); } catch (e) {}
  try { if (R.mr && R.mr.state !== 'inactive') R.mr.stop(); } catch (e) {}
  if (R.stopP) await R.stopP;
  paint(); $('#tx').setAttribute('contenteditable', 'true'); recUI();
}
function recAbort(){ if (R) clearInterval(R.tt); if (R && R.on) { R.on = false; clearInterval(R.timer); try { R.sr && R.sr.abort(); } catch (e) {} try { R.mr && R.mr.state !== 'inactive' && R.mr.stop(); } catch (e) {} } R = null; }
function recToggle(){ R.on ? recStop() : recStart(); }
function recPause(){
  if (!R.on) return;
  R.paused = !R.paused;
  if (R.paused) { try { R.sr && R.sr.stop(); } catch (e) {} try { R.mr && R.mr.pause(); } catch (e) {} }
  else { try { R.sr && R.sr.start(); } catch (e) {} try { R.mr && R.mr.resume(); } catch (e) {} }
  recUI();
}

/* ---------- 대화형 훈련: 생각 코치는 묻기만 하고, 답이나 의견은 주지 않는다 ---------- */
// [임시] 짧게 답했을 때 한 번 더 파고드는 질문. 기획자가 정리한 내용으로 바꿀 예정. (실제 AI 연결 시 이 부분을 AI가 만든다)
const PROBES = ['왜 그렇게 생각하나요?', '예를 하나 들어 볼 수 있을까요?', '조금 더 구체적으로 말해 볼래요?', '그렇게 생각하는 근거는 뭔가요?', '반대로 생각하면 어떻게 될까요?'];
const HAT = {'🔵':'#4a7bd0', '⚪':'#cfcfcf', '🔴':'#e2554a', '🟡':'#f2c94c', '⚫':'#2a2a2a', '🟢':'#5bb46a'};
const hatColor = st => { for (const [k, v] of Object.entries(HAT)) if (st.startsWith(k)) return v; return '#bdbdbd'; };
const stepColor = (t, k) => (t.colors && t.colors[k]) || hatColor(t.steps[k] || '');
const isSoc = () => C && C.t.mode === 'socratic';
const NOT_FOUND = /(모르겠|몰라|모름|없는 ?것 ?같|없어|없다|글쎄|못 ?찾|안 ?떠오|생각이 안|딱히)/;
const quote = (x, n = 40) => { x = x.trim().replace(/\s+/g, ' '); return x.length > n ? x.slice(0, n - 1) + '…' : x; };
function splitStep(st){ const k = st.indexOf(' — '); return k < 0 ? {label: '', ask: st} : {label: st.slice(0, k), ask: st.slice(k + 3)}; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* ChatGPT 연결: 로컬 서버(server.py)의 /api/ai 를 거친다. 키는 서버에만 있다.
   서버 없이 열었거나 실패하면 null → 앱은 규칙 기반으로 대신 동작한다. */
async function askAI(payload){
  if (location.protocol === 'file:') return null;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch('/api/ai', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload), signal: ctl.signal});
    clearTimeout(tm);
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

async function ai(text, color, byAI){

  C.msgs.pop(); C.msgs.push({who: 'ai', text, color, byAI}); C.busy = false; paintChat();
}
async function nextStep(){
  if (!C) return;
  C.step++; C.probed = false;
  if (C.step >= C.t.steps.length) return coachFinish();
  const st = C.t.steps[C.step], sp = splitStep(st), color = stepColor(C.t, C.step);
  if (isSoc()) {
    let ask = sp.ask;
    const a0 = C.answers[0].join(' ');
    if (C.step === 1 && a0) ask = `“${quote(a0)}”라고 했는데, 왜 그렇게 생각해?`;   // 사용자의 말을 그대로 인용
    if (C.step === 3 && C.noCounter) ask = '반대되는 경우는 지금 못 찾았어. 그래도 처음 답에서 바꾸고 싶은 부분이 있어? 없다면 그대로 두는 이유는?';
    return ai(ask, color);
  }
  const lead = sp.label ? (C.step === 0 ? `${sp.label}부터 써 볼게요. ` : `${sp.label}로 바꿔 쓸게요. `) : '';
  await ai(lead + sp.ask, color);
}
async function coachSend(){
  if (!C || C.busy || C.done) return;
  const el = $('#cin'), v = el.value.trim(); if (!v) return;
  el.value = ''; el.style.height = 'auto'; coachMicOff();
  C.msgs.push({who: 'me', text: v}); paintChat();
  if (!C.q) { C.q = v; await coachIntro(); return nextStep(); }
  C.answers[C.step].push(v);
  if (isSoc()) return socraticAfter(v);
  const last = C.t.steps.length - 1, color = stepColor(C.t, C.step);
  if (!C.probed && C.step > 0 && C.step < last) {
    C.probed = true;
    // ChatGPT가 이번 답을 읽고 한 걸음 더 파고들 질문을 만든다 (답은 주지 않음)
    C.busy = true; C.msgs.push({who: 'typing'}); paintChat();
    const res = await askAI({task: 'probe', question: C.q, technique: C.t.name, step: C.t.steps[C.step],
      previous: C.t.steps.slice(0, C.step).map((st, k) => [splitStep(st).label, C.answers[k].join(' ')]), answer: C.answers[C.step].join(' ')});
    if (!C) return;
    C.msgs.pop(); C.busy = false; paintChat();
    if (res && res.question) { if (res.deeper) return ai(res.question, color, true); return nextStep(); }
    // AI를 못 쓰면 규칙 기반: 답이 짧을 때만 한 번 더 묻기
    if (v.length < 20) return ai(PROBES[(C.step + C.q.length) % PROBES.length], color);
  }
  nextStep();
}
/* 소크라테스식 문답: 3단계(반대되는 경우)에서 못 찾으면 범위를 좁히는 힌트 질문을 최대 2번. 반례를 대신 말하지 않는다. */
async function socraticAfter(v){
  if (C.step === 2 && (NOT_FOUND.test(v) || v.length < 4)) {
    if (C.hints < 2) {
      C.hints++;
      C.busy = true; C.msgs.push({who: 'typing'}); paintChat();
      const res = await askAI({task: 'hint', level: C.hints, question: C.q, first: C.answers[0].join(' '), reason: C.answers[1].join(' ')});
      if (!C) return;
      C.msgs.pop(); C.busy = false; paintChat();
      return res && res.question ? ai(res.question, stepColor(C.t, 2), true) : ai(C.t.hints[C.hints - 1], stepColor(C.t, 2));
    }
    C.answers[2].push('지금은 못 찾았어요'); C.noCounter = true;
    await ai('괜찮아. 지금은 못 찾았다고 적어 둘게. 다시 꺼낼 때 또 찾아보자.', stepColor(C.t, 2));
  }
  nextStep();
}
function coachPick(q){ if (!C || C.busy || C.q) return; $('#cin').value = q; coachSend(); }
function coachSkip(){ if (!C || C.busy || C.done || !C.q || C.step < 0) return; coachMicOff(); nextStep(); }
async function coachFinish(){
  C.done = true; paintChat();
  if (isSoc() && !C.answers[4].join('').trim()) await ai('결론 칸이 비어 있어. "결론 없음"으로 저장해 두고, 다시 꺼낼 때 이어서 쓰자.');
  else await ai(isSoc() ? '여기까지 네가 직접 쓴 생각이야. 나는 결론에 대해 맞다 틀리다 말하지 않아.' : '잘했어요. 오늘 스스로 한 생각을 단계별로 모아 봤어요. 제가 덧붙인 말은 없어요.');
  if (!C) return;
  C.msgs.push({who: 'sum'}); paintChat();
}
function coachSave(){
  if (!C) return;
  const convo = C.t.steps.map((st, k) => ({label: splitStep(st).label || `${k + 1}단계`, a: C.answers[k]}));
  const lastA = C.answers[C.answers.length - 1].join(' ');
  const noConc = isSoc() && !lastA.trim();
  if (C.resume) {   // 다시 꺼내 문답한 경우: 같은 질문에 지금의 결론으로 저장
    const m = S.mine.find(x => x.id === C.resume);
    if (m) { m.convo2 = convo; m.now = lastA; m.noConclusion = noConc; if (!noConc) { m.status = 'answered'; m.answeredAt = now(); } m.thinkSec = (m.thinkSec || 0) + Math.round((now() - C.t0) / 1000); save(); }
    coachStop(); U.hist = []; U.view = 'home'; U.p = {}; render(); window.scrollTo(0, 0);
    return toast(noConc ? '저장했어요. 결론은 다음에 이어서 써요' : '지금의 결론을 저장했어요');
  }
  const all = C.answers.flat().join(' ');
  const snap = {q: C.q, then: noConc ? '' : (lastA || C.answers.flat().slice(-1)[0] || ''), noConclusion: noConc, convo, thinkSec: Math.round((now() - C.t0) / 1000), tech: C.t.id, cat: tagOf(C.q + ' ' + all), qtype: qTypeOf(C.q)};
  pickReturn((o, id) => {
    S.mine.push({id, ...snap, createdAt: now(), returnAt: now() + o[2], status: 'locked'}); save();
    coachStop(); goHomeSaved(o);
  });
}
function paintChat(){
  if (!C) return;
  const prog = $('#prog');
  if (prog) [...prog.children].forEach((e, k) => { e.className = k < C.step || C.done ? 'ok' : k === C.step ? 'cur' : ''; });
  const qm = $('#qmini');
  if (qm) qm.innerHTML = C.q ? `<div class="qmini sticky">${I.pin}<span>오늘의 질문</span>${esc(C.q)}</div>` : '';
  $('#chat').innerHTML = C.msgs.map(m => {
    if (m.who === 'typing') return `<div class="msg ai typing"><i></i><i></i><i></i></div>`;
    if (m.who === 'ai') return `<div class="msg ai" style="--hc:${m.color || '#d6d6d4'}"><span class="who">생각 코치${m.byAI ? ' <em>✨ AI가 만든 질문</em>' : ''}</span>${esc(m.text)}</div>`;
    if (m.who === 'me') return `<div class="msg me">${esc(m.text)}</div>`;
    if (m.who === 'recs') return C.q ? '' : `<div class="crecs">${m.items.map(r => `<button class="rec" onclick="coachPick(this.dataset.q)" data-q="${esc(r.q)}"><span>${esc(r.type)}</span>${esc(r.q)}</button>`).join('')}</div>`;
    return `<div class="sumcard"><p class="lbl">오늘 스스로 한 생각</p>
      ${C.t.steps.map((st, k) => `<div class="cv" style="--hc:${stepColor(C.t, k)}"><b>${esc(splitStep(st).label || (k + 1) + '단계')}</b><p>${C.answers[k].length ? C.answers[k].map(esc).join('<br>') : `<span class="muted">${C.resume && k < 2 ? '지난번 기록' : '건너뜀'}</span>`}</p></div>`).join('')}
      ${isSoc() ? `<div class="conc ${C.answers[4].join('').trim() ? '' : 'empty'}"><span>내 결론</span>${C.answers[4].join('').trim() ? esc(C.answers[4].join(' ')) : '결론 없음 · 다시 꺼낼 때 이어서 써요'}</div>` : ''}
      <button class="go-train" onclick="coachSave()">${C.resume ? '지금의 결론 저장' : '돌아올 날 정하고 저장'}</button></div>`;
  }).join('');
  const bar = $('#cbar'); if (bar) bar.style.display = C.done ? 'none' : '';
  const sk = $('#skip'); if (sk) sk.style.visibility = C.q && C.step >= 0 && !C.done ? 'visible' : 'hidden';
  window.scrollTo(0, document.body.scrollHeight);
}
/* 말로 답하기 (받아쓰기) */
function coachMic(){
  if (!C) return;
  if (C.sr) return coachMicOff();
  const SRc = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SRc) return toast('이 브라우저는 음성 인식을 지원하지 않아요. 크롬에서 열어 주세요');
  const el = $('#cin'), base = el.value ? el.value + ' ' : '';
  const sr = new SRc(); sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true;
  let fin = '';
  sr.onresult = e => {
    let interim = '';
    for (let k = e.resultIndex; k < e.results.length; k++) { const r = e.results[k]; if (r.isFinal) fin += r[0].transcript.trim() + ' '; else interim += r[0].transcript; }
    el.value = base + fin + interim; el.dispatchEvent(new Event('input'));
  };
  sr.onerror = e => { if (e.error === 'not-allowed') toast('마이크 권한을 허용해 주세요'); coachMicOff(); };
  sr.onend = () => { if (C && C.sr === sr) coachMicOff(); };
  try { sr.start(); C.sr = sr; $('#cmic').classList.add('on'); } catch (e) {}
}
function coachMicOff(){ if (!C || !C.sr) return; const sr = C.sr; C.sr = null; try { sr.stop(); } catch (e) {} const b = $('#cmic'); if (b) b.classList.remove('on'); }

  <div class="frame">${I.pin}<div class="inner">
    <p class="fq">${esc(m.q)}</p>
    ${m.convo ? `<p class="lbl">그때의 생각 · 단계별</p>${m.convo.map(c => `<div class="cv old"><b>${esc(c.label)}</b><p>${c.a.length ? c.a.map(esc).join('<br>') : '—'}</p></div>`).join('')}`
             : `<p class="lbl">그때의 답</p><p class="then">${esc(m.then)}</p>`}

  </div></div>

  <div class="sticky nowsticky">${I.pin}<p class="lbl">지금의 답</p>
    <textarea id="nowA" placeholder="그때와 지금, 생각이 달라졌나요?">${esc(m.now || '')}</textarea></div>
  <div class="bottombar">
    <div class="tog ${U.toBoard ? 'on' : ''}" onclick="U.toBoard=!U.toBoard;this.classList.toggle('on')"><span class="sw"></span>게시판에 붙이기</div>

/* ---------- ⑥ 골라서 답하기 (받은 질문) ---------- */
function vInbox(){
  const F = U.inboxFilter, all = S.received;
  const cnt = {'전체': all.length, '답함': all.filter(r => r.status === 'answered').length, '무시': all.filter(r => r.status === 'ignored').length};
  const show = all.filter(r => F === '전체' || (F === '답함' ? r.status === 'answered' : r.status === 'ignored'));
  const postIds = [...new Set(all.map(r => r.postId))];
  const groups = postIds.map(pid => {
    const p = S.posts.find(x => x.id === pid);
    const list = show.filter(r => r.postId === pid).sort((a, b) => b.at - a.at).map(rc).join('');
    if (!list) return '';
    return `<button class="banner" onclick="go('detail',{id:'${pid}'})">${esc(p ? p.a : '')}</button>${list}`;
  }).join('');
  return `
  <header class="top"><button class="ib" onclick="back()">${I.back}</button><span class="ttl">받은 질문</span><span class="cnt">${all.length}</span></header>
  <div class="chips">${Object.keys(cnt).map(f => `<button class="chip ${F === f ? 'on' : ''}" onclick="U.inboxFilter='${f}';render()">${f} ${cnt[f]}</button>`).join('')}</div>
  ${groups || `<div class="empty">받은 질문이 없어요</div>`}`;
}
function rc(r){
  const head = `<div class="meta"><span>익명</span>${r.status === 'answered' ? '<span class="tag dark">답함</span>' : r.status === 'ignored' ? '<span class="tag">무시함</span>' : `<span class="t">${fmtT(r.at)}</span>`}</div>`;
  let body = '';
  if (r.status === 'new' && U.replyId === r.id) {
    body = `<div class="rbox"><textarea id="rtxt" placeholder="골라서 답하기"></textarea><button class="send" onclick="sendReply('${r.id}')">${I.up}</button></div>`;
  } else if (r.status === 'new') {
    body = `<div class="acts"><button class="re" onclick="U.replyId='${r.id}';render();$('#rtxt').focus()">답글 ${I.pen}</button><button class="no" onclick="ignore('${r.id}')">무시 ${I.x}</button></div>`;
  } else if (r.status === 'answered') {
    body = `<p class="myreply">${esc(r.reply)}</p>`;
  }
  const mk = r.status !== 'ignored' && r.text.length > 6 ? `<button class="mk" onclick="toCard('${r.id}')">↗ 다음 질문 카드로 만들기</button>` : '';
  return `<div class="rc ${r.status === 'ignored' ? 'ign' : ''}">${head}<p class="txt">${esc(r.text)}</p>${body}${mk}</div>`;
}
function sendReply(id){
  const v = $('#rtxt').value.trim(); if (!v) return;
  const r = S.received.find(x => x.id === id);
  r.status = 'answered'; r.reply = v;
  const p = S.posts.find(x => x.id === r.postId); if (p) p.thread.push({q: r.text, a: v});
  U.replyId = null; save(); render(); toast('답글을 달았어요. 게시판에 함께 보여요');
}
function ignore(id){ S.received.find(x => x.id === id).status = 'ignored'; save(); render(); }
function toCard(id){
  const r = S.received.find(x => x.id === id);
  if (S.cards.some(c => c.q === r.text)) return toast('이미 질문 카드에 있어요');
  S.cards.push({id: uid(), q: r.text, from: '받은 질문', cat: tagOf(r.text)}); save();
  toast('질문 카드에 추가했어요', '보러 가기', () => go('cards'));
}

/* ---------- 정한 시간이 되면 돌려주기 ---------- */
setInterval(() => {
  let arrived = null;
  S.mine.forEach(m => { if (m.status === 'locked' && m.returnAt <= now()) { m.status = 'open'; arrived = m; } });
  if (arrived) {
    save();
    const m = arrived;
    toast(`📮 ${ago(m.createdAt)}의 생각이 돌아왔어요`, '열어 보기', () => go('recall', {id: m.id}));
    if (U.view === 'home') render();
  } else if (U.view === 'home' && S.mine.some(m => m.status === 'locked' && m.returnAt - now() < HOUR)) {
    render();
  }
}, 1000);

/* 카드 스와이프 */
let sx = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#stack')) sx = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) { S.cardIdx += dx < 0 ? 1 : -1; save(); render(); }
});

render();
try { if (TUTORIAL.length && !localStorage.getItem(TUT_KEY)) openTutorial(); } catch (e) {}
</script>
